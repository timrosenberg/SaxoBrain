name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.164.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          wget -q -O hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the site (stops on broken composer links)
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Check that no existing address disappears
        run: |
          python3 scripts/check_addresses.py public/addresses.txt "${{ steps.pages.outputs.base_url }}/" \
            "${{ steps.pages.outputs.base_url }}/addresses.txt" \
            "https://timrosenberg.github.io/SaxoBrain/addresses.txt"

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
