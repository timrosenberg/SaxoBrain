name: Check living composers

# Once a month, ask Wikidata whether any composer we list as living has died.
# If so, open an issue (or comment on the open one) so Tim can confirm and fill in `died:`.
on:
  schedule:
    - cron: "0 14 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Ask Wikidata
        id: check
        run: |
          if python3 scripts/check_living.py report.md; then
            echo "found=no" >> "$GITHUB_OUTPUT"
          else
            echo "found=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the issue
        if: steps.check.outputs.found == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Composers who may have died"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi
