<title>SaxoBrain Curriculum Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: the live site's single 980px column. Overview = a four-year grid (strands down, years across);
   year page = everything for one year, with a sticky section bar. Tokens are copied from static/css/site.css. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --fg: #1b2029; --muted: #5d6676; --line: #dde1e8;
  --accent: #9a6514; --accent-soft: #f3e7d2; --chip: #eceff3;
  --lv-1: #2f8a4c; --lv-2: #b58a0e; --lv-3: #2f6fb8; --lv-4: #c0453a;
  --notice-bg: #fbf6e4; --notice-line: #b08900; --shadow: 0 10px 40px rgba(20, 26, 36, .16);
  --mock: #1b2029; --mock-fg: #f5f6f8;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Public Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --surface: #1a1e26; --fg: #e7eaf0; --muted: #9aa3b2; --line: #2b313c;
    --accent: #e0a64a; --accent-soft: #3a2e1c; --chip: #242a34;
    --lv-1: #5cc27c; --lv-2: #e3bb45; --lv-3: #6aa6ea; --lv-4: #ee7b70;
    --notice-bg: #2d2614; --notice-line: #c9a227; --shadow: 0 10px 40px rgba(0, 0, 0, .5);
    --mock: #e7eaf0; --mock-fg: #12151b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --fg: #e7eaf0; --muted: #9aa3b2; --line: #2b313c;
  --accent: #e0a64a; --accent-soft: #3a2e1c; --chip: #242a34;
  --lv-1: #5cc27c; --lv-2: #e3bb45; --lv-3: #6aa6ea; --lv-4: #ee7b70;
  --notice-bg: #2d2614; --notice-line: #c9a227; --shadow: 0 10px 40px rgba(0, 0, 0, .5);
  --mock: #e7eaf0; --mock-fg: #12151b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 64px; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
a { color: var(--accent); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; }
h1 { font-weight: 700; font-size: 34px; line-height: 1.12; letter-spacing: -.01em; margin: 4px 0 6px; }
h2 { font-weight: 700; font-size: 23px; margin: 0; }
h3 { font-weight: 500; font-size: 18px; margin: 0; }
.label-sm { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }

/* mockup ribbon (not part of the design) */
.mockbar { background: var(--mock); color: var(--mock-fg); font-size: 12.5px; padding: 7px 16px; text-align: center; }
.mockbar b { font-weight: 600; }

/* site header, as on the live site */
.site-head, main, .site-foot { max-width: 980px; margin: 0 auto; padding-inline: 20px; }
.site-head { display: flex; flex-wrap: wrap; padding-block: 28px 0; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 34px; letter-spacing: -.02em; line-height: 1.1; color: var(--fg); text-decoration: none; }
.brand span { color: var(--accent); }
.site-head nav { flex-basis: 100%; display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-top: 8px; }
.site-head nav a { text-decoration: none; color: var(--muted); padding: 10px 14px; border-bottom: 2px solid transparent; font-weight: 600; margin-bottom: -1px; }
.site-head nav a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
main { padding-block: 18px 64px; }
.site-foot { color: var(--muted); font-size: 13px; padding-block: 24px 40px; border-top: 1px solid var(--line); text-align: center; }

/* shared bits */
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; background: var(--c); }
.y1 { --c: var(--lv-1); } .y2 { --c: var(--lv-2); } .y3 { --c: var(--lv-3); } .y4 { --c: var(--lv-4); }
.crumbs { font-size: 13.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.crumbs a { color: var(--muted); }
.lede { color: var(--muted); max-width: 60ch; margin: 4px 0 0; font-size: 16px; }
.tag { font-size: 11.5px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--muted); white-space: nowrap; font-weight: 500; }
.go { font-weight: 600; text-decoration: none; }
.go:hover { text-decoration: underline; }

/* instrument switch: one control for the whole curriculum */
.sax { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; gap: 2px; }
.sax button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; cursor: pointer; color: var(--muted); }
.sax button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(20, 26, 36, .18); }
.sax-wrap { display: flex; align-items: center; gap: 10px; }

/* ---------- overview ---------- */
.ov-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.matrix { margin-top: 26px; display: grid; grid-template-columns: 116px repeat(4, minmax(0, 1fr)); column-gap: 10px; }
.matrix > * { grid-column: var(--x); grid-row: var(--y); min-width: 0; }
.m-label { padding: 14px 0; border-top: 1px solid var(--line); }
.m-yhead { background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0; padding: 14px 14px 12px; text-decoration: none; color: var(--fg); position: relative; overflow: hidden; display: grid; gap: 2px; }
.m-yhead::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--c); }
.m-yhead .n { display: flex; align-items: center; gap: 7px; }
.m-yhead b { font-family: var(--font-display); font-weight: 700; font-size: 19px; }
.m-yhead .go { font-size: 13.5px; color: var(--accent); }
.m-yhead:hover { border-color: var(--c); }
.m-cell { background: var(--surface); border-inline: 1px solid var(--line); border-top: 1px solid var(--line); padding: 12px 14px; font-size: 13.5px; line-height: 1.45; cursor: pointer; text-align: left; }
.m-cell:hover { background: color-mix(in srgb, var(--c) 7%, var(--surface)); }
.m-cell.last { border-bottom: 1px solid var(--line); border-radius: 0 0 12px 12px; }
.m-cell ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.m-cell .k { display: none; }
.m-cell i { font-style: italic; }
.m-cell .sub { color: var(--muted); }
.m-cell .cats { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.m-cell .cat { background: color-mix(in srgb, var(--c) 16%, var(--surface)); border-radius: 999px; padding: 0 8px; font-size: 12.5px; }
.m-cell .theme { font-weight: 600; }
.how { margin-top: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px; }
.how div { border-top: 2px solid var(--fg); padding-top: 10px; }
.how p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.how h3 { font-size: 16px; font-weight: 700; }

/* ---------- year page ---------- */
.y-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 20px; align-items: end; margin-top: 6px; }
.y-head .eyebrow { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.y-head h1 { margin: 2px 0 0; }
.ysteps { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.ystep { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px 5px 10px; font-weight: 600; font-size: 13.5px; color: var(--fg); text-decoration: none; cursor: pointer; }
.ystep:hover { border-color: var(--c); }
.ystep[aria-current="page"] { background: color-mix(in srgb, var(--c) 22%, var(--surface)); border-color: var(--c); }
.secbar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin-top: 18px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.secbar a { white-space: nowrap; padding: 10px 12px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.secbar a:hover, .secbar a.on { color: var(--fg); border-bottom-color: var(--c); }
.sec { padding-top: 30px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-h .label-sm { margin: 0; }

.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.card > h3 { margin-bottom: 8px; }
.goals { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.goals li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; }
.goals li::before { content: ""; width: 12px; height: 12px; margin-top: 5px; border: 2px solid var(--c); border-radius: 3px; }
.goals .detail { display: block; color: var(--muted); font-size: 14px; }
.goals .sublist { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.goals .sublist span { background: var(--chip); border-radius: 999px; padding: 1px 9px; font-size: 13px; }
.book { display: grid; gap: 1px; padding: 8px 0; border-top: 1px solid var(--line); }
.book:first-of-type { border-top: 0; padding-top: 0; }
.book .t { font-weight: 600; }
.book .links { display: flex; gap: 12px; font-size: 13.5px; margin-top: 3px; }

/* solo repertoire */
.rule { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; background: var(--accent-soft); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; }
.rule p { margin: 0; max-width: 62ch; font-size: 14.5px; }
.planbtn { border: 1px solid var(--accent); background: var(--surface); color: var(--accent); border-radius: 999px; padding: 5px 14px; font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.planbtn[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.catgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.catcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0; }
.catcard header { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px 8px; gap: 10px; }
.catcard header .label-sm { white-space: nowrap; }
.pieces { list-style: none; margin: 0; padding: 0; }
.piece { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 9px 16px; border-top: 1px solid var(--line); align-items: center; }
.piece .t { font-weight: 600; color: var(--fg); text-decoration: none; }
.piece .t:hover { color: var(--accent); text-decoration: underline; }
.piece .who { color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 0 6px; align-items: center; }
.piece .who .note::before { content: "· "; }
.piece .who a { color: var(--muted); }
.acts { display: flex; gap: 6px; align-items: center; }
.act { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; color: var(--fg); white-space: nowrap; }
.act:hover { border-color: var(--accent); color: var(--accent); }
.act.listen { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.act svg { width: 10px; height: 10px; fill: currentColor; }
.pick { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 9px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--muted); }
.pick[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.piece.chosen { background: color-mix(in srgb, var(--c) 8%, var(--surface)); }
.planner { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.planner .card h3 { display: flex; justify-content: space-between; align-items: baseline; }
.planner .card h3 small { font-family: var(--font-body); font-size: 12.5px; color: var(--muted); font-weight: 500; }
.planner dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 14px; }
.planner dt { color: var(--muted); }
.planner dd { margin: 0; min-width: 0; }
.planner dd.empty { color: var(--muted); font-style: italic; }
.planner .warn { color: var(--lv-4); font-size: 13px; display: block; }
.planfoot { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); gap: 12px; flex-wrap: wrap; }
.planfoot button { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; }
.more { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border: 1px dashed var(--line); border-radius: 12px; padding: 12px 16px; font-size: 14.5px; }

/* jazz */
.scales { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); gap: 8px; }
.scale { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--surface); }
.scale b { font-weight: 600; display: block; }
.scale code { font-family: var(--font-mono); font-size: 13.5px; letter-spacing: .02em; color: var(--accent); }
.scale small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.4; margin-top: 2px; }
.jz-block { margin-top: 20px; }
.jz-block > .label-sm { display: block; margin-bottom: 8px; }
.theory { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.tunegroups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px; }
.tunes { list-style: none; margin: 0; padding: 0; }
.tunes li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); align-items: baseline; }
.tunes li:first-child { border-top: 0; }
.tunes .tt { font-weight: 600; }
.tunes .tc { color: var(--muted); font-size: 13px; display: block; }
.tunes .acts { flex-shrink: 0; }
.tunes.cols { columns: 3 220px; column-gap: 24px; }
.tunes.cols li { break-inside: avoid; border-top: 0; border-bottom: 1px solid var(--line); }
.keynote { font-size: 13.5px; color: var(--muted); margin: 0 0 10px; }
.keynote b { color: var(--fg); }
.booktunes { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.booktunes span { background: var(--chip); border-radius: 999px; padding: 1px 10px; font-size: 13px; }

/* reading and listening */
.term { display: grid; gap: 8px; align-content: start; }
.term > .label-sm { display: flex; align-items: center; gap: 8px; }
.read { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; text-decoration: none; color: var(--fg); display: grid; gap: 2px; }
.read:hover { border-color: var(--accent); }
.read .t { font-weight: 600; font-family: var(--font-display); font-size: 16.5px; line-height: 1.25; }
.read .in { font-style: italic; color: var(--muted); font-size: 13.5px; }
.read .by { color: var(--muted); font-size: 13.5px; }
.read .note { font-size: 13.5px; margin-top: 4px; }
.read .kind { justify-self: start; margin-top: 4px; }
.focus { font-size: 14px; color: var(--muted); }
.focus b { color: var(--fg); }
.albums { list-style: none; margin: 0; padding: 0; counter-reset: a; }
.albums li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 8px; padding: 8px 0; border-top: 1px solid var(--line); align-items: baseline; counter-increment: a; }
.albums li:first-child { border-top: 0; padding-top: 0; }
.albums li::before { content: counter(a); font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.albums .t { font-style: italic; font-weight: 600; }
.albums .a { display: block; color: var(--muted); font-size: 13.5px; }
.albums .nolink { font-size: 12.5px; color: var(--muted); font-style: italic; }
.yfoot { margin-top: 40px; display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
.yfoot a { text-decoration: none; display: grid; cursor: pointer; }
.yfoot a small { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.yfoot a b { font-family: var(--font-display); font-size: 18px; color: var(--fg); }
.yfoot a:last-child { text-align: right; }

@media (max-width: 820px) {
  .matrix { display: grid; grid-template-columns: 1fr; row-gap: 0; }
  .matrix > * { grid-column: auto; grid-row: auto; }
  .m-label { display: none; }
  .m-yhead { margin-top: 16px; }
  .m-cell .k { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
  .catgrid, .planner { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .brand { font-size: 28px; }
  h1 { font-size: 28px; }
  .y-head { grid-template-columns: 1fr; }
  .piece { grid-template-columns: 1fr; }
  .acts { margin-top: 4px; }
  .tunes li { flex-direction: column; gap: 2px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<script>
const DATA = /*DATA*/;
const YEARS = DATA.years;
const SAX = { alto: "Alto saxophone", tenor: "Tenor saxophone" };
const KEY = { alto: "E♭", tenor: "B♭" };
const STRANDS = [["technique", "Technique"], ["etudes", "Études"], ["rep", "Solo repertoire"], ["jazz", "Jazz"], ["reading", "Reading"], ["listening", "Listening"]];
const app = document.getElementById("app");

const store = {
  get(k, d) { try { const v = localStorage.getItem("sb-cur-" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("sb-cur-" + k, JSON.stringify(v)); } catch (e) {} },
};
const state = { sax: store.get("sax", "alto"), planning: store.get("planning", false), plan: store.get("plan", {}) };

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ext = (u, label, cls = "act") => u ? `<a class="${cls}" href="${esc(u)}" target="_blank" rel="noopener">${label}</a>` : "";
const PLAY = `<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z"/></svg>`;
const shortTitle = t => t.replace(/ \((Alto|Tenor)\)$/, "");
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

function saxSwitch() {
  return `<div class="sax-wrap"><span class="label-sm">I play</span><div class="sax" role="group" aria-label="Instrument">${
    Object.entries(SAX).map(([k, v]) => `<button type="button" data-sax="${k}" aria-pressed="${state.sax === k}">${v.split(" ")[0]}</button>`).join("")
  }</div></div>`;
}

/* ---------- overview ---------- */
function cellHTML(y, key) {
  const rep = y.rep[state.sax];
  switch (key) {
    case "technique":
      return `<ul>${y.technique.map(t => `<li>${esc(t.text)}${t.detail ? `<span class="sub">: ${esc(t.detail.replace(/^./, c => c.toLowerCase()))}</span>` : ""}${t.list ? `<span class="sub"> (${esc(t.list.join(", ").toLowerCase())})</span>` : ""}</li>`).join("")}</ul>`;
    case "etudes":
      return `<ul>${y.etudes.map(e => `<li><i>${esc(e.title)}</i> <span class="sub">${esc(e.composer.split(" ").slice(-1)[0])}</span></li>`).join("")}</ul>`;
    case "rep": {
      const n = rep.categories.reduce((a, c) => a + c.pieces.length, 0);
      return `<div>${n} pieces in ${rep.categories.length} categories</div><div class="cats">${rep.categories.map(c => `<span class="cat">${esc(c.name)}</span>`).join("")}</div>`;
    }
    case "jazz": {
      const j = y.jazz, out = [];
      if (j.scales) out.push(j.scales.some(s => s.f) ? `${j.scales.length} scales and modes, memorized` : `Jazz scales: ${j.scales.map(s => s.name.toLowerCase()).join(", ")}`);
      if (j.theory) out.push("Chord spelling and chord–scale theory");
      if (j.etudes) out.push(j.etudes.map(e => `${esc(e.composer.split(" ").slice(-1)[0])}, <i>${esc(e.title)}</i>`).join("; "));
      if (j.tunes) { const n = j.tunes.reduce((a, g) => a + g.items.length, 0); out.push(`${n} tunes: ${j.tunes.map(g => g.group.replace(/^[A-Z](?=[a-z])/, c => c.toLowerCase())).join(", ")}`); }
      if (j.books) out.push(j.books.map(b => `Snidero, <i>${esc(b.title)}</i> (${b.tunes.length} tunes)`).join(""));
      return `<ul>${out.map(o => `<li>${o}</li>`).join("")}</ul>`;
    }
    case "reading":
      return `<div class="theme">${esc(y.readingTheme)}</div><div class="sub">${y.reading.filter(r => r.term === "Fall").length} in fall, ${y.reading.filter(r => r.term === "Spring").length} in spring</div>`;
    case "listening":
      return `<div>${plural(y.listening.reduce((a, g) => a + g.albums.length, 0), "album")}</div><div class="sub">${y.listening.map(g => `${g.albums.length} ${/jazz/i.test(g.group) ? "jazz" : "classical"}`).join(", ")}</div>`;
  }
}

function overview() {
  let cells = STRANDS.map(([k, label], r) => `<div class="m-label" style="--x:1;--y:${r + 2}"><span class="label-sm">${label}</span></div>`).join("");
  YEARS.forEach((y, i) => {
    cells += `<a class="m-yhead y${y.n}" style="--x:${i + 2};--y:1" href="#${y.id}"><span class="n label-sm"><span class="dot"></span>Year ${y.n}</span><b>${esc(y.name)}</b><span class="go">Open this year →</span></a>`;
    STRANDS.forEach(([k, label], r) => {
      cells += `<div class="m-cell y${y.n}${r === STRANDS.length - 1 ? " last" : ""}" role="link" tabindex="0" data-go="${y.id}" data-sec="${k}" style="--x:${i + 2};--y:${r + 2}"><span class="k">${label}</span>${cellHTML(y, k)}</div>`;
    });
  });
  app.innerHTML = `
  <div class="ov-head">
    <div><h1>Curriculum</h1><p class="lede">Four years of study for college saxophonists. Each year has technique goals, an étude book, solo repertoire to choose from, jazz, reading and listening. Read across a row to see how a skill builds; open a year to see everything for that year on one page.</p></div>
    ${saxSwitch()}
  </div>
  <div class="matrix">${cells}</div>
  <div class="how">
    <div><h3>Solo repertoire</h3><p>Each category is a menu. Choose one piece per category each semester, with Listen and Score links beside every piece.</p></div>
    <div><h3>Alto or tenor</h3><p>Pick your instrument once. Repertoire lists and jazz lead sheets follow it across every year.</p></div>
    <div><h3>Beyond these lists</h3><p>Every year links to the full catalog, filtered to that year of study and your instrument.</p></div>
  </div>`;
}

/* ---------- year page ---------- */
const planKey = (y) => `${y.id}:${state.sax}`;
const pieceKey = p => p.url + "#" + p.title;

function pieceHTML(y, ci, p) {
  const plan = state.plan[planKey(y)] || {};
  const k = pieceKey(p);
  const fall = plan.fall?.[ci] === k, spring = plan.spring?.[ci] === k;
  const from = p.from ? `<span>from <a href="${esc(p.from.url)}" target="_blank" rel="noopener"><i>${esc(p.from.title)}</i></a> (${esc(p.from.where)})</span>` : "";
  const right = state.planning
    ? `<button type="button" class="pick" data-pick="fall" data-ci="${ci}" data-k="${esc(k)}" aria-pressed="${fall}">Fall</button><button type="button" class="pick" data-pick="spring" data-ci="${ci}" data-k="${esc(k)}" aria-pressed="${spring}">Spring</button>`
    : `${ext(p.listen, PLAY + "Listen", "act listen")}${ext(p.free, "Free score")}${p.free ? "" : ext(p.buy, "Score")}`;
  return `<li class="piece${fall || spring ? " chosen" : ""}">
    <div><a class="t" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(shortTitle(p.title))}</a>${p.solo ? ` <span class="tag">Unaccompanied</span>` : ""}
      <div class="who"><span>${esc(p.composer)}</span>${p.note ? `<span class="note">${esc(p.note)}</span>` : ""}${from ? `<span class="note">${from}</span>` : ""}</div></div>
    <div class="acts">${right}</div></li>`;
}

function plannerHTML(y, rep) {
  const plan = state.plan[planKey(y)] || {};
  const find = k => rep.categories.flatMap(c => c.pieces).find(p => pieceKey(p) === k);
  const strict = rep.intro.some(t => /semester 2/i.test(t));
  const term = (t, label) => {
    const n = rep.categories.filter((c, ci) => plan[t]?.[ci]).length;
    return `<div class="card"><h3>${label}<small>${n} of ${rep.categories.length} chosen</small></h3><dl>${rep.categories.map((c, ci) => {
      const p = plan[t]?.[ci] && find(plan[t][ci]);
      const same = strict && t === "spring" && p && plan.fall?.[ci] === plan.spring?.[ci];
      return `<dt>${esc(c.name)}</dt><dd class="${p ? "" : "empty"}">${p ? esc(shortTitle(p.title)) + ` <span class="muted">${esc(p.composer.split(" ").slice(-1)[0])}</span>` : "Not chosen yet"}${same ? `<span class="warn">Same piece as fall. Choose a different one for spring.</span>` : ""}</dd>`;
    }).join("")}</dl></div>`;
  };
  return `<div class="planner">${term("fall", "Fall")}${term("spring", "Spring")}
    <div class="planfoot"><span>Your plan is saved in this browser only. Bring it to your lesson.</span><button type="button" data-clear>Clear plan</button></div></div>`;
}

function yearPage(y) {
  const rep = y.rep[state.sax];
  const i = YEARS.indexOf(y), prev = YEARS[i - 1], next = YEARS[i + 1];
  const n = rep.categories.reduce((a, c) => a + c.pieces.length, 0);
  const ruleText = rep.intro.some(t => /semester 2/i.test(t))
    ? "Each semester, choose one piece from each category. In the spring, choose a different piece in each category than you played in the fall."
    : y.n === 4 ? "By the time a student reaches their fourth year of study they should have advanced enough in their technique to play most of the saxophone repertoire. The pieces below are suggestions."
    : "Choose your pieces with your teacher. The categories below give a balanced program.";
  const catalogURL = (lv) => `${DATA.site}/?sax=${state.sax === "alto" ? "Alto" : "Tenor"}+Saxophone&lvl=${encodeURIComponent(lv).replace(/%20/g, "+")}`;
  const sax = SAX[state.sax];

  const j = y.jazz;
  const tuneActs = t => {
    const sheet = state.sax === "alto" ? t.eb : t.bb;
    return `${ext(t.rec, PLAY + "Recording", "act listen")}${ext(t.pa, "Play-along")}${ext(sheet, KEY[state.sax] + " lead sheet")}`;
  };
  const anyLinks = j.tunes && j.tunes.some(g => g.items.some(t => t.rec || t.pa || t.eb || t.bb));
  const jazz = `
    ${j.scales ? `<div class="jz-block"><span class="label-sm">${esc(j.scalesTitle || "Jazz scales")}</span>
      <div class="scales">${j.scales.map(s => `<div class="scale"><b>${esc(s.name)}</b>${s.f ? `<code>${esc(s.f)}</code>` : ""}${s.note ? `<small>${esc(s.note)}</small>` : ""}</div>`).join("")}</div>
      ${j.scalesNote ? `<p class="keynote">${esc(j.scalesNote)}: <a href="${DATA.site}/resources/the-scale-series/" target="_blank" rel="noopener">The Scale Series</a></p>` : ""}</div>` : ""}
    ${j.theory ? `<div class="jz-block"><span class="label-sm">Jazz theory</span><ul class="theory">${j.theory.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
    ${j.etudes ? `<div class="jz-block"><span class="label-sm">Jazz études</span><div class="pair">${j.etudes.map(e => `<div class="card"><div class="t"><b><i>${esc(e.title)}</i></b></div><div class="muted">${esc(e.composer)}</div></div>`).join("")}</div></div>` : ""}
    ${j.tunes ? `<div class="jz-block"><span class="label-sm">Tunes to learn and improvise on</span>
      ${anyLinks ? `<p class="keynote">Lead sheets are shown in <b>${KEY[state.sax]}</b> for ${sax.toLowerCase()}.</p>` : ""}
      ${j.tunes.length === 1 && j.tunes[0].items.length > 12
        ? `<ul class="tunes cols">${j.tunes[0].items.map(t => `<li><span class="tt">${esc(t.t)}</span></li>`).join("")}</ul>`
        : `<div class="tunegroups">${j.tunes.map(g => `<div class="card"><h3>${esc(g.group)}</h3><ul class="tunes">${g.items.map(t => `<li><span><span class="tt">${esc(t.t)}</span>${t.c ? ` <span class="tc">${esc(t.c)}</span>` : ""}</span><span class="acts">${tuneActs(t)}</span></li>`).join("")}</ul></div>`).join("")}</div>`}</div>` : ""}
    ${j.books ? `<div class="jz-block"><span class="label-sm">Method book</span>${j.books.map(b => `<div class="card"><b><i>${esc(b.title)}</i></b> <span class="muted">${esc(b.composer)}</span><div class="booktunes">${b.tunes.map(t => `<span>${esc(t)}</span>`).join("")}</div></div>`).join("")}</div>` : ""}`;

  const terms = ["Fall", "Spring"].map(t => `<div class="term"><span class="label-sm">${t}</span>${y.reading.filter(r => r.term === t).map(r => `
      <a class="read" href="${esc(r.url)}" target="_blank" rel="noopener"><span class="t">${esc(r.title)}</span>${r.in ? `<span class="in">${esc(r.in)}</span>` : ""}<span class="by">${esc(r.by)}</span>${r.note ? `<span class="note">${esc(r.note)}</span>` : ""}<span class="tag kind">${r.kind === "PDF" ? "PDF" : "Read on SaxoBrain"}</span></a>`).join("")}</div>`).join("");

  const listening = y.listening.map(g => `<div class="card"><h3>${esc(g.group.replace(/^./, c => c.toUpperCase()))}</h3><ol class="albums">${g.albums.map(a => `
      <li><span><span class="t">${esc(a.t)}</span><span class="a">${esc(a.a)}${a.note ? ` · ${esc(a.note)}` : ""}</span></span>
      <span class="acts">${a.u ? ext(a.u, a.free ? "Free download" : PLAY + "Listen", a.free ? "act" : "act listen") : `<span class="nolink">No public link yet</span>`}${ext(a.page, "Notes")}</span></li>`).join("")}</ol></div>`).join("");

  app.innerHTML = `
  <div class="y${y.n}">
  <div class="crumbs"><a href="#overview">Curriculum</a><span>/</span><span>${esc(y.name)}</span></div>
  <div class="y-head">
    <div><div class="eyebrow"><span class="dot"></span>Year ${y.n} of 4</div><h1>${esc(y.name)}</h1></div>
    ${saxSwitch()}
  </div>
  <div class="ysteps">${YEARS.map(o => `<a class="ystep y${o.n}" href="#${o.id}" ${o === y ? 'aria-current="page"' : ""}><span class="dot"></span>${esc(o.name)}</a>`).join("")}</div>

  <nav class="secbar" aria-label="On this page">${STRANDS.map(([k, l]) => `<a href="#" data-sec="${k}">${l}</a>`).join("")}</nav>

  <section class="sec" id="s-technique"><div class="pair">
    <div class="card"><h3>Technique</h3><ul class="goals">${y.technique.map(t => `<li><div>${t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.text)}</a>` : esc(t.text)}${t.detail ? `<span class="detail">${esc(t.detail)}</span>` : ""}${t.list ? `<div class="sublist">${t.list.map(s => `<span>${esc(s)}</span>`).join("")}</div>` : ""}</div></li>`).join("")}</ul></div>
    <div class="card" id="s-etudes"><h3>Études</h3>${y.etudes.map(e => `<div class="book"><a class="t" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a><span class="muted">${esc(e.composer)}</span><span class="links">${e.buy ? `<a href="${esc(e.buy)}" target="_blank" rel="noopener">Buy the book</a>` : ""}${e.also ? `<a href="${esc(e.also.u)}" target="_blank" rel="noopener">${esc(e.also.t)}</a>` : ""}</span></div>`).join("")}</div>
  </div></section>

  <section class="sec" id="s-rep">
    <div class="sec-h"><h2>Solo repertoire <span class="muted" style="font-weight:500">· ${sax}</span></h2><span class="label-sm">${n} pieces</span></div>
    <div class="rule"><p>${esc(ruleText)}</p><button type="button" class="planbtn" data-plan aria-pressed="${state.planning}">${state.planning ? "Done planning" : "Plan my year"}</button></div>
    ${state.planning ? plannerHTML(y, rep) : ""}
    <div class="catgrid">${rep.categories.map((c, ci) => `<div class="catcard"><header><h3>${esc(c.name)}</h3><span class="label-sm">Choose one · ${c.pieces.length}</span></header><ul class="pieces">${c.pieces.map(p => pieceHTML(y, ci, p)).join("")}</ul></div>`).join("")}</div>
    <div class="more"><span>Looking for something else? The catalog lists <b>${y.more[state.sax]}</b> ${y.name.split(" ")[0].toLowerCase()}-year pieces for ${sax.toLowerCase()}${y.n === 4 ? ` and <b>${y.moreAdv[state.sax]}</b> advanced pieces` : ""}.</span>
      <span><a class="go" href="${catalogURL(y.catalog)}" target="_blank" rel="noopener">Browse ${y.name.split(" ")[0].toLowerCase()}-year pieces →</a>${y.n === 4 ? ` &nbsp; <a class="go" href="${catalogURL("Advanced")}" target="_blank" rel="noopener">Advanced →</a>` : ""}</span></div>
  </section>

  <section class="sec" id="s-jazz"><div class="sec-h"><h2>Jazz</h2></div>${jazz}</section>

  <section class="sec" id="s-reading"><div class="sec-h"><h2>Reading</h2><span class="focus">This year’s focus: <b>${esc(y.readingTheme)}</b></span></div><div class="pair">${terms}</div></section>

  <section class="sec" id="s-listening"><div class="sec-h"><h2>Listening</h2></div><div class="pair">${listening}</div></section>

  <div class="yfoot">${prev ? `<a href="#${prev.id}"><small>← Previous year</small><b>${esc(prev.name)}</b></a>` : `<a href="#overview"><small>← Back to</small><b>All four years</b></a>`}${next ? `<a href="#${next.id}"><small>Next year →</small><b>${esc(next.name)}</b></a>` : `<a href="#overview"><small>Back to →</small><b>All four years</b></a>`}</div>
  </div>`;
}

/* ---------- routing and events ---------- */
function render(scrollTo) {
  const id = location.hash.slice(1);
  const y = YEARS.find(o => o.id === id);
  y ? yearPage(y) : overview();
  if (scrollTo) document.getElementById("s-" + scrollTo)?.scrollIntoView();
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
app.addEventListener("click", e => {
  const t = e.target.closest("[data-sax],[data-go],[data-sec],[data-plan],[data-pick],[data-clear]");
  if (!t) return;
  if (t.dataset.sax) { state.sax = t.dataset.sax; store.set("sax", state.sax); const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (t.dataset.go) { history.pushState(null, "", "#" + t.dataset.go); render(t.dataset.sec); }
  else if (t.dataset.sec) { e.preventDefault(); document.getElementById("s-" + t.dataset.sec)?.scrollIntoView(); }
  else if (t.hasAttribute("data-plan")) { state.planning = !state.planning; store.set("planning", state.planning); const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (t.dataset.pick) {
    const y = YEARS.find(o => o.id === location.hash.slice(1)); const pk = planKey(y);
    const plan = state.plan[pk] ||= {}; const term = plan[t.dataset.pick] ||= {};
    term[t.dataset.ci] = term[t.dataset.ci] === t.dataset.k ? undefined : t.dataset.k;
    store.set("plan", state.plan); const s = window.scrollY; render(); window.scrollTo(0, s);
  }
  else if (t.hasAttribute("data-clear")) {
    const y = YEARS.find(o => o.id === location.hash.slice(1)); delete state.plan[planKey(y)];
    store.set("plan", state.plan); const s = window.scrollY; render(); window.scrollTo(0, s);
  }
});
app.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.dataset.go) { e.preventDefault(); e.target.click(); } });
window.addEventListener("popstate", () => render());
render();
</script>
