<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
</head>
<body>
<header class="site-head">
<a class="brand" href="{{ "/" | relURL }}">Saxo<span>Brain</span></a>
<nav>
<a href="{{ "/" | relURL }}">Repertoire</a>
<a href="{{ "curriculum/" | relURL }}">Curriculum</a>
<a href="{{ "reading/" | relURL }}">Reading</a>
</nav>
</header>
<main>
{{ block "main" . }}{{ end }}
</main>
<footer class="site-foot">
<p>Built and maintained by Timothy Rosenberg. Licensed {{ site.Params.license }}.</p>
</footer>
</body>
</html>
